# Optional: Ohara (github.com/L00rdD/ohara), the manga library on port 8585. It
# searches volumes through Prowlarr, downloads them with Transmission, files them in
# manga/<Series>/ and reads them in the browser. Built from its own repository:
# update it with `docker compose build ohara && docker compose up -d ohara`.
# Switch it on in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ohara.yml
services:
  ohara:
    build: https://github.com/L00rdD/ohara.git#main
    image: ohara:local
    container_name: ohara
    init: true
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - TZ=${TZ:-Europe/Paris}
      # Prowlarr indexers to search, by their name in Prowlarr
      - OHARA_INDEXERS=${OHARA_INDEXERS:-YggReborn,Nyaa.si,Knaben}
      # optional: a Discord channel's webhook, told when tomes come in and when a
      # followed series gets new ones; Ohara's address, for the links of its messages
      - OHARA_DISCORD_WEBHOOK=${OHARA_DISCORD_WEBHOOK:-}
      - OHARA_URL=${OHARA_URL:-}
    volumes:
      - ${DATA_ROOT:-/mnt/storage}/manga:/manga
      # Ohara reads Prowlarr's API key here
      - ./config/prowlarr/config.xml:/config/prowlarr/config.xml:ro
    ports:
      - 8585:8585
    restart: unless-stopped
