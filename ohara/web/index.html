<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2a26">
  <title>Ohara</title>
  <link rel="icon" href="/ohara.svg">
  <link rel="stylesheet" href="/ohara.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="#" aria-label="Ohara, ta bibliothèque"><img src="/ohara.svg" alt="" width="44" height="44"><span>Ohara</span></a>
    <form class="search" id="search" role="search">
      <input type="search" name="q" placeholder="Chercher un manga" aria-label="Chercher un manga" autocomplete="off" required>
      <button class="button primary">Chercher</button>
    </form>
  </header>

  <main>
    <section class="resume" id="resume" hidden></section>

    <section id="downloads" hidden>
      <h2>En cours de téléchargement</h2>
      <ul class="downloads" id="download-list"></ul>
    </section>

    <section id="results" hidden>
      <div class="section-head">
        <h2 id="results-title"></h2>
        <label class="check"><input type="checkbox" id="all-languages"> Afficher aussi l'anglais</label>
        <button class="button quiet" type="button" id="close-results">Fermer</button>
      </div>
      <p class="searching" id="searching" hidden>Recherche sur YggReborn, Nyaa et Knaben, ça peut prendre une minute.</p>
      <div class="finds" id="finds"></div>
    </section>

    <section id="shelf">
      <div class="section-head">
        <h2>Ta bibliothèque</h2>
        <span class="count" id="shelf-count"></span>
      </div>
      <div class="empty" id="empty" hidden>
        <p>Ta bibliothèque est vide. Cherche un manga et récupère tous ses tomes en un clic.</p>
        <p class="examples">Par exemple <button class="link" type="button" data-try="Frieren">Frieren</button>, <button class="link" type="button" data-try="Naruto">Naruto</button> ou <button class="link" type="button" data-try="Berserk">Berserk</button>.</p>
      </div>
      <div class="books" id="books"></div>
    </section>

    <section class="series" id="series" hidden></section>
  </main>
  <script src="/library.js" defer></script>
</body>
</html>
