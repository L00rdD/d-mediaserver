<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="A glitching play button inside a notched red frame">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="play" d="M64 46 L104 70 L64 94 Z"/>
    <clipPath id="whole"><rect x="0" y="0" width="160" height="54"/><rect x="0" y="59" width="160" height="22"/><rect x="0" y="84" width="160" height="76"/></clipPath>
    <clipPath id="slice-a"><rect x="0" y="54" width="160" height="5"/></clipPath>
    <clipPath id="slice-b"><rect x="0" y="81" width="160" height="3"/></clipPath>
  </defs>
  <g fill="none" filter="url(#glow)">
    <!-- outer frame, corners cut like the menus' panels -->
    <path d="M44 20 H140 V116 L116 140 H20 V44 Z" stroke="#ff6158" stroke-width="5"/>
    <path d="M52 30 H130 V112 L112 130 H30 V52 Z" stroke="#ff6158" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- cyan corner ticks -->
    <path d="M128 12 H148 V32 M32 148 H12 V128" stroke="#5ef6ff" stroke-width="3"/>
  </g>
  <!-- ten cells, one per disk in the pool, filled like a buffer -->
  <g fill="#ff6158" filter="url(#glow)">
    <rect x="42" y="108" width="6" height="10"/><rect x="50" y="108" width="6" height="10"/>
    <rect x="58" y="108" width="6" height="10"/><rect x="66" y="108" width="6" height="10"/>
    <rect x="74" y="108" width="6" height="10"/><rect x="82" y="108" width="6" height="10"/>
    <rect x="90" y="108" width="6" height="10"/>
    <g fill-opacity="0.25"><rect x="98" y="108" width="6" height="10"/><rect x="106" y="108" width="6" height="10"/><rect x="114" y="108" width="6" height="10"/></g>
  </g>
  <!-- play, split and shifted like a glitch -->
  <use href="#play" fill="#5ef6ff" opacity="0.85" transform="translate(-3 0)"/>
  <use href="#play" fill="#f3e600" clip-path="url(#whole)"/>
  <g clip-path="url(#slice-a)"><use href="#play" fill="#f3e600" transform="translate(5 0)"/></g>
  <g clip-path="url(#slice-b)"><use href="#play" fill="#f3e600" transform="translate(-4 0)"/></g>
</svg>
