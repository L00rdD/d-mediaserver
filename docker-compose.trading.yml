# Optional: show the trading bot on the home page.
# The bot (a separate project, ~/trading-bot on the Pi) writes state/status.json after
# every decision; this mounts that folder read-only into the home page container so
# it is served at /trading-bot/status.json. The page hides the card when the file is
# missing. Enable with COMPOSE_FILE=docker-compose.yml:docker-compose.trading.yml in .env
# and point TRADING_BOT_STATE at the bot's state folder if it is not ../trading-bot/state.
services:
  home:
    volumes:
      - ${TRADING_BOT_STATE:-../trading-bot/state}:/srv/trading-bot:ro
