# games-share: the games folder as a plain directory index (the format DBI, Tinfoil
# and Sphaira read on the Switch), read-only, with resumable downloads.
server {
    listen 80;
    root /games;
    charset utf-8;

    location / {
        autoindex on;
        autoindex_exact_size on;
        # hide Questarr's and the OS's own files
        location ~ /\. { deny all; }
    }
}
