# Every service sees the storage pool under the same path: /data
# DATA_ROOT defaults to the mergerfs pool on the Pi; override it in .env
# (e.g. DATA_ROOT=./data) to run the stack on another machine.
# PUID/PGID/TZ can be overridden in .env too (a NAS rarely uses 1000:1000).
# SKIP_LOCAL_LOGIN=1 in .env makes Radarr, Sonarr and Prowlarr skip the login
# on the local network (no password to create or forget). Without it the
# *__AUTH__* lines are empty and each app keeps its own login settings.
# HOME_PORT is the port the home page is served on (80). Its links to the apps
# reuse the name or IP typed to reach it.
# docker-compose.legacy.yml adds the folder names of the first version of this
# project for installs that are being updated (see DEPLOY.md).
# docker-compose.vpn.yml sends Transmission through a VPN (see README).
# Never forward these ports to the internet.
services:
  home:
    image: caddy:latest
    container_name: home
    volumes:
      - ./home/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./home/site:/srv:ro
    ports:
      - ${HOME_PORT:-80}:80
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./config/transmission:/config
      - ${DATA_ROOT:-/mnt/storage}:/data
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - RADARR__AUTH__METHOD=${SKIP_LOCAL_LOGIN:+Forms}
      - RADARR__AUTH__REQUIRED=${SKIP_LOCAL_LOGIN:+DisabledForLocalAddresses}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./config/radarr:/config
      - ${DATA_ROOT:-/mnt/storage}:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # Public resolver: ISPs often answer 127.0.0.1 for indexer sites, which
    # breaks the searches. Only the indexers' lookups use it.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PROWLARR__AUTH__METHOD=${SKIP_LOCAL_LOGIN:+Forms}
      - PROWLARR__AUTH__REQUIRED=${SKIP_LOCAL_LOGIN:+DisabledForLocalAddresses}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    # Public resolver: ISPs often answer 127.0.0.1 for indexer sites, which
    # breaks the searches. Only the indexers' lookups use it.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - LOG_LEVEL=info
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    ports:
      - 8191:8191
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - SONARR__AUTH__METHOD=${SKIP_LOCAL_LOGIN:+Forms}
      - SONARR__AUTH__REQUIRED=${SKIP_LOCAL_LOGIN:+DisabledForLocalAddresses}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./config/sonarr:/config
      - ${DATA_ROOT:-/mnt/storage}:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./config/jellyfin:/config
      - ${DATA_ROOT:-/mnt/storage}:/data
    ports:
      - 8096:8096
    restart: unless-stopped
