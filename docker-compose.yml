services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
    volumes:
      - ./config/plex:/config
      # Media paths for Plex (Old drive)
      - /mnt/media/movies:/data/movies
      - /mnt/media/shows:/data/shows
      # Media paths for Plex (New drive)
      - /mnt/disk/movies:/data/disk_movies
      - /mnt/disk/shows:/data/disk_shows
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/transmission:/config
      # Unified download paths (Old drive)
      - /mnt/media/complete:/downloads/complete
      - /mnt/media/incomplete:/downloads/incomplete
      # Unified download paths (New drive)
      - /mnt/disk/complete:/downloads/disk_complete
      - /mnt/disk/incomplete:/downloads/disk_incomplete
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/radarr:/config
      # Final destination for movies (Old drive)
      - /mnt/media/movies:/movies
      # Final destination for movies (New drive)
      - /mnt/disk/movies:/disk_movies
      # Unified path matching Transmission (Old drive)
      - /mnt/media/complete:/downloads/complete
      # Unified path matching Transmission (New drive)
      - /mnt/disk/complete:/downloads/disk_complete
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - 8191:8191
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/sonarr:/config
      # Final destination for TV shows (Old drive)
      - /mnt/media/shows:/shows
      # Final destination for TV shows (New drive)
      - /mnt/disk/shows:/disk_shows
      # Unified path matching Transmission (Old drive)
      - /mnt/media/complete:/downloads/complete
      # Unified path matching Transmission (New drive)
      - /mnt/disk/complete:/downloads/disk_complete
    ports:
      - 8989:8989
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./config/jellyfin:/config
      # Media paths for Jellyfin matching Plex structure (Old drive)
      - /mnt/media/movies:/data/movies
      - /mnt/media/shows:/data/shows
      # Media paths for Jellyfin matching Plex structure (New drive)
      - /mnt/disk/movies:/data/disk_movies
      - /mnt/disk/shows:/data/disk_shows
    ports:
      - 8096:8096
    restart: unless-stopped
