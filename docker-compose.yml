services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Paris
      # Set the internal Web UI port
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      # Unified download paths matching Radarr and Sonarr
      - /volume1/downloads/complete:/downloads/complete
      - /volume1/downloads/incomplete:/downloads/incomplete
    ports:
      # HTTP Web UI port
      - 8080:8080
      # Torrent traffic ports
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Paris
    volumes:
      - ./config/radarr:/config
      - /volume1/media/movies:/movies
      - /volume1/downloads/complete:/downloads/complete
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Paris
    volumes:
      - ./config/sonarr:/config
      - /volume1/media/shows:/shows
      - /volume1/downloads/complete:/downloads/complete
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Paris
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - PUID=1026
      - PGID=100
      - TZ=Europe/Paris
    ports:
      - 8191:8191
    restart: unless-stopped
