# Optional: video games, one section per console (Switch, Nintendo, PlayStation, Xbox,
# Sega, retro, PC).
# - Kirby, port 8587: the Radarr of games. Its catalogues need no key nor account
#   (titledb for the Switch, libretro's box arts for the older consoles, Steam for the
#   PC); it searches the games through Prowlarr's indexers and downloads them with
#   Transmission (so through the VPN) straight into games/<console>/<Game>/.
# - games-share, port 8586: the games/ folder, read-only, as a plain file index that
#   DBI, Tinfoil or Sphaira install from over wifi on a modded Switch, and that a
#   browser or an emulator front-end downloads from.
# Switch it on in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.games.yml
services:
  kirby:
    build: ${KIRBY_BUILD:-https://github.com/L00rdD/kirby.git#main}
    image: kirby:local
    container_name: kirby
    init: true
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - TZ=${TZ:-Europe/Paris}
      # the share's address as the console reaches it, shown in Kirby (an IP: the
      # Switch rarely resolves local names); else this host's name, port 8586
      - KIRBY_SHARE_URL=${KIRBY_SHARE_URL:-}
    volumes:
      - ${DATA_ROOT:-/mnt/storage}/games:/games
      # Kirby reads Prowlarr's API key here
      - ./config/prowlarr/config.xml:/config/prowlarr/config.xml:ro
    ports:
      - 8587:8587
    restart: unless-stopped

  games-share:
    image: nginx:alpine
    container_name: games-share
    volumes:
      - ./games/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_ROOT:-/mnt/storage}/games:/games:ro
    ports:
      - ${GAMES_SHARE_PORT:-8586}:80
    restart: unless-stopped
