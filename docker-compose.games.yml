# Optional: video games, Switch first.
# - Questarr (github.com/Doezer/Questarr), the Radarr of games on port 5000: a
#   catalogue from IGDB (any platform), searched through Prowlarr's indexers and
#   downloaded with Transmission (so through the VPN), filed in games/<Platform>/.
#   Its first page asks for an admin account and the IGDB keys (a free Twitch
#   developer app, see the README).
# - games-share, port 8586: the games/ folder, read-only, as a plain file index that
#   DBI, Tinfoil or Sphaira install from over wifi on a modded Switch, and that a
#   browser downloads from for an emulator (Ryujinx, Eden).
# Switch it on in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.games.yml
services:
  questarr:
    image: ghcr.io/doezer/questarr:latest
    container_name: questarr
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./config/questarr:/app/data
      # same /data as Transmission, so finished downloads move into games/
      - ${DATA_ROOT:-/mnt/storage}:/data
    ports:
      - ${QUESTARR_PORT:-5000}:5000
    restart: unless-stopped

  games-share:
    image: nginx:alpine
    container_name: games-share
    volumes:
      - ./games/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_ROOT:-/mnt/storage}/games:/games:ro
    ports:
      - ${GAMES_SHARE_PORT:-8586}:80
    restart: unless-stopped
