# Optional: reads and downloads manga with Suwayomi (suwayomi.org), a server
# version of the Mihon/Tachiyomi app with a web reader on port 4567.
# - Scans: add a source from the extension store (Browse → Extensions, French
#   sources under "fr"), add the series to the library and turn on the
#   automatic download of new chapters (Settings → Downloads). The library is
#   checked every 12 h. Chapters land in manga/scans as CBZ.
# - Volumes downloaded by torrent: put each series in its own folder in
#   manga/local (manga/local/<Series>/<volume>.cbz); they show under the
#   "Local source".
# Switch it on in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.manga.yml
services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    user: ${PUID:-1000}:${PGID:-1000}
    # Public resolver: ISPs often answer 127.0.0.1 for scan sites.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TZ=${TZ:-Europe/Paris}
      - DOWNLOAD_AS_CBZ=true
      - UPDATE_INTERVAL=12
      - EXTENSION_STORES=["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]
      # Cloudflare pages go through the stack's FlareSolverr instead of an
      # embedded Chromium, which is too heavy for a Pi.
      - KCEF_ENABLED=false
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - JAVA_TOOL_OPTIONS=-Xmx768m
    volumes:
      # the downloads and local mounts must come before the data folder
      - ${DATA_ROOT:-/mnt/storage}/manga/scans:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${DATA_ROOT:-/mnt/storage}/manga/local:/home/suwayomi/.local/share/Tachidesk/local
      - ./config/suwayomi:/home/suwayomi/.local/share/Tachidesk
    ports:
      - 4567:4567
    restart: unless-stopped
